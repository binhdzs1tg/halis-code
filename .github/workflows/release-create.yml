name: release create

# Push a semver tag (v0.3.0) and the release assembles itself: the notes
# are grouped from the commit log since the previous tag, the GitHub
# release is published, and the two downstream pipelines — npm publish and
# desktop release — pick it up and attach their artifacts. Nothing in
# this workflow knows how to build; its only job is the paper trail.
# contents: write is what lets `gh release create` publish the release —
# read-only here meant every tag push died on a 403 and the two downstream
# pipelines never fired.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to cut the release from
        required: true

permissions:
  contents: write

concurrency:
  group: release-create-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    name: create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the notes walk the log back to the previous tag
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::tag '$tag' is not a semver — nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "$tag^{commit}" > /dev/null; then
            echo "::error::tag '$tag' does not exist on this repository"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Notes from the commit log
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2> /dev/null || true)"
          if [ -n "$prev" ]; then
            since="$prev"
          else
            # no earlier tag — the notes start at the root commit
            since="$(git rev-list --max-parents=0 "$TAG" | head -1)"
          fi
          echo "notes cover ${since}..${TAG}"
          bash .github/scripts/release-notes.sh "$since" "$TAG" > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --title "Halis Code $TAG" \
            --notes-file notes.md \
            --repo "$REPO"
