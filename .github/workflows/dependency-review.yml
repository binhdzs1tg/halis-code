name: dependency review

# Compares package-lock.json against the base branch on pull requests and
# fails the build on known vulnerabilities or license conflicts before
# they land. The default policy is exactly what this repo wants — nothing
# to configure, nothing to maintain.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: review dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
