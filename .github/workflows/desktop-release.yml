name: desktop release

# Runs when a release is published (and on demand for a dry run). Builds
# the Electron app on all three platforms in parallel and attaches the
# installers to the release: dmg (mac, arm64 + x64), deb + AppImage
# (linux), exe (windows). Upstream of this workflow, release-create turns
# a pushed tag into the published release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          # electron-builder fetches its own electron zips, the binary in
          # node_modules would be dead weight
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning::tag '$TAG' is not a semver — keeping the version already in package.json"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const f = 'apps/desktop/package.json';
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = '$VER';
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            console.log('@halis/desktop ' + p.version);
          "

      - name: Build
        run: npm run build -w @halis/desktop

      - name: Package
        run: npx electron-builder --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Job summary
        if: github.event_name == 'release'
        shell: bash
        run: |
          shopt -s nullglob
          {
            echo "### Desktop installers (${{ matrix.os }})"
            echo
            for f in apps/desktop/release/*.dmg apps/desktop/release/*.exe apps/desktop/release/*.deb apps/desktop/release/*.AppImage; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halis-code-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.exe apps/desktop/release/*.deb apps/desktop/release/*.AppImage)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
